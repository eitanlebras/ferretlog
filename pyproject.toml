[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ferretlog"
version = "0.1.0"
description = "git log for your Claude Code agent runs — ferrets hoard everything"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["ai", "agents", "claude", "llm", "developer-tools", "cli"]

[project.scripts]
ferretlog = "ferretlog:main"

[tool.setuptools]
py-modules = ["ferretlog"]
